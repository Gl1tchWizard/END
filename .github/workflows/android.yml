name: Build END Android

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feature/**' ]
    tags: [ 'v*' ]

jobs:
  debug:
    name: Debug build
    if: "!startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: END-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Signed release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # The release key never lives in the repository. It is a repository
      # secret holding the keystore base64 encoded, decoded here and deleted
      # with the runner. Same key as the Play upload, so both channels carry
      # one signature.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.END_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "END_KEYSTORE_BASE64 is not set. Add the signing secrets before tagging a release." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/end-release.jks"

      - name: Build release APK
        env:
          END_KEYSTORE: ${{ runner.temp }}/end-release.jks
          END_KEYSTORE_PASSWORD: ${{ secrets.END_KEYSTORE_PASSWORD }}
          END_KEY_ALIAS: ${{ secrets.END_KEY_ALIAS }}
          END_KEY_PASSWORD: ${{ secrets.END_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Check the APK is actually signed
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: END-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            Install directly, or track this repository in Obtainium for updates.

            Verify the download before installing:

                apksigner verify --print-certs app-release.apk

            Source and privacy policy are in this repository. END has no
            Internet permission and sends nothing anywhere.
